<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apex Automaton — dashboard</title>
    <!--
      A static, dependency-free dashboard that reads the committed /state files
      and shows the trading book's equity over cycles, the score metrics, and the
      current positions. Serve the repo root and open /dashboard/, e.g.:
          npx serve .      (then visit http://localhost:3000/dashboard/)
      It fetches ../state/state.json and ../state/journal.ndjson relative to
      this file. No build step, no framework.
    -->
    <style>
      :root {
        --bg: #0b0f14;
        --fg: #e6edf3;
        --muted: #8b98a5;
        --accent: #5ad19b;
        --line: #1f2933;
      }
      @media (prefers-color-scheme: light) {
        :root { --bg: #ffffff; --fg: #0b0f14; --muted: #5a6672; --accent: #0a7f52; --line: #e2e8f0; }
      }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
      .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .muted { color: var(--muted); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
      .tile { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
      .tile .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
      .tile .v { font-size: 20px; font-weight: 600; margin-top: 4px; }
      svg { width: 100%; height: 260px; border: 1px solid var(--line); border-radius: 10px; }
      table { width: 100%; border-collapse: collapse; margin-top: 8px; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
      code { color: var(--accent); }
      .err { color: #e06c75; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Apex Automaton</h1>
      <div class="muted">Autonomous agent trading a paper book against real prices · the market decides, grow or die.</div>
      <div id="nav" class="muted" style="margin-top:6px">
        <a href="../setup/">⚙ Setup wizard (build your .env)</a>
      </div>

      <div id="tiles" class="grid"></div>

      <h2 style="font-size:16px">Book equity over time (USD)</h2>
      <svg id="chart" viewBox="0 0 900 260" aria-label="equity over cycles chart"></svg>

      <h2 style="font-size:16px">Current book</h2>
      <div id="population" class="muted">—</div>

      <h2 style="font-size:16px">Recent cycles</h2>
      <table id="cycles"><thead><tr><th>#</th><th>tier</th><th>action</th><th>equity $</th><th>cycle PnL $</th><th>burn $</th></tr></thead><tbody></tbody></table>

      <p id="status" class="muted" style="margin-top:16px"></p>
    </div>

    <script>
      const SOL = 1e9;
      const fmt = (lamports) => (lamports / SOL).toFixed(4);

      async function loadJson(path) {
        const r = await fetch(path, { cache: 'no-store' });
        if (!r.ok) throw new Error(`${path}: ${r.status}`);
        return r.json();
      }
      async function loadNdjson(path) {
        const r = await fetch(path, { cache: 'no-store' });
        if (!r.ok) throw new Error(`${path}: ${r.status}`);
        const text = await r.text();
        return text.split('\n').filter((l) => l.trim()).map((l) => JSON.parse(l));
      }

      function tile(k, v) {
        const el = document.createElement('div');
        el.className = 'tile';
        el.innerHTML = `<div class="k">${k}</div><div class="v">${v}</div>`;
        return el;
      }

      function drawChart(entries) {
        const NS = 'http://www.w3.org/2000/svg';
        const svg = document.getElementById('chart');
        svg.innerHTML = '';
        const add = (name, attrs, text) => {
          const el = document.createElementNS(NS, name);
          for (const k in attrs) el.setAttribute(k, attrs[k]);
          if (text != null) el.textContent = text;
          svg.appendChild(el);
          return el;
        };

        const W = 900, H = 260, m = { l: 66, r: 16, t: 14, b: 40 };
        const iw = W - m.l - m.r, ih = H - m.t - m.b;
        const pts = entries.map((e, i) => ({ x: e.cycle ?? i + 1, y: e.equityUsd ?? 0 }));

        if (pts.length === 0) {
          add('text', { x: W / 2, y: H / 2, 'text-anchor': 'middle', fill: 'var(--muted)', 'font-size': 13 }, 'no cycles yet');
          return;
        }

        const ys = pts.map((p) => p.y), xs = pts.map((p) => p.x);
        let minY = Math.min(...ys), maxY = Math.max(...ys);
        if (maxY - minY < 0.02) { maxY += 0.5; minY -= 0.5; }
        const minX = Math.min(...xs), maxX = Math.max(...xs);
        const sx = (x) => m.l + (maxX === minX ? iw / 2 : ((x - minX) / (maxX - minX)) * iw);
        const sy = (y) => m.t + ih - ((y - minY) / (maxY - minY)) * ih;

        // Y gridlines + $ labels
        const yticks = 4;
        for (let i = 0; i <= yticks; i++) {
          const v = minY + ((maxY - minY) * i) / yticks;
          const yy = sy(v);
          add('line', { x1: m.l, y1: yy, x2: m.l + iw, y2: yy, stroke: 'var(--line)', 'stroke-width': i === 0 ? 1 : 0.5, opacity: i === 0 ? 1 : 0.5 });
          add('text', { x: m.l - 8, y: yy + 4, 'text-anchor': 'end', fill: 'var(--muted)', 'font-size': 11 }, '$' + v.toFixed(2));
        }
        // X axis line
        add('line', { x1: m.l, y1: m.t + ih, x2: m.l + iw, y2: m.t + ih, stroke: 'var(--line)', 'stroke-width': 1 });
        // X labels (cycle numbers, up to ~7)
        const step = Math.max(1, Math.ceil(pts.length / 7));
        pts.forEach((p, i) => {
          if (i % step !== 0 && i !== pts.length - 1) return;
          add('text', { x: sx(p.x), y: m.t + ih + 18, 'text-anchor': 'middle', fill: 'var(--muted)', 'font-size': 11 }, String(p.x));
        });
        // Axis titles
        add('text', { x: m.l + iw / 2, y: H - 6, 'text-anchor': 'middle', fill: 'var(--muted)', 'font-size': 11 }, 'cycle');
        add('text', { x: 14, y: m.t + ih / 2, 'text-anchor': 'middle', fill: 'var(--muted)', 'font-size': 11, transform: `rotate(-90 14 ${m.t + ih / 2})` }, 'equity $');

        // Line + points
        if (pts.length >= 2) {
          const d = pts.map((p, i) => `${i ? 'L' : 'M'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join(' ');
          add('path', { d, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2 });
        }
        pts.forEach((p) => add('circle', { cx: sx(p.x), cy: sy(p.y), r: 2.5, fill: 'var(--accent)' }));
      }

      (async () => {
        const status = document.getElementById('status');
        try {
          const [state, journal] = await Promise.all([
            loadJson('../state/state.json'),
            loadNdjson('../state/journal.ndjson').catch(() => []),
          ]);

          const s = state.score ?? {};
          const usd = (n) => `$${(Number(n) || 0).toFixed(2)}`;
          const tiles = document.getElementById('tiles');
          tiles.append(
            tile('cycle', state.cycle ?? 0),
            tile('equity', usd(s.equityUsd)),
            tile('net PnL', usd(s.netPnlUsd)),
            tile('peak equity', usd(s.peakEquityUsd)),
            tile('cycles traded', s.tradeCycles ?? 0),
            tile('compute burn', usd(s.cumulativeBurnUsd)),
            tile('first profit at', s.firstProfitAtCycle ?? '—'),
            tile('open positions', Object.keys((state.desk ?? {}).positions ?? {}).length),
          );

          drawChart(journal);

          const pop = document.getElementById('population');
          const desk = state.desk ?? { cashUsd: 0, positions: {} };
          const prices = state.lastPrices ?? {};
          const posEntries = Object.entries(desk.positions ?? {});
          const posHtml = posEntries.length
            ? posEntries
                .map(([a, p]) => {
                  const price = prices[a] ?? p.entryPriceUsd;
                  const valUsd = p.units * price;
                  return `${a} <b>${valUsd >= 0 ? 'long' : 'short'}</b> ${usd(Math.abs(valUsd))}`;
                })
                .join(' · ')
            : 'all in cash';
          pop.innerHTML = `<b>Cash:</b> ${usd(desk.cashUsd)} &nbsp;|&nbsp; <b>Positions:</b> ${posHtml}`;

          const tbody = document.querySelector('#cycles tbody');
          journal.slice(-15).reverse().forEach((e) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${e.cycle}</td><td>${e.tier}</td><td>${e.action}</td><td>${(e.equityUsd ?? 0).toFixed(2)}</td><td>${(e.cyclePnlUsd ?? 0).toFixed(2)}</td><td>${(e.costUsd ?? 0).toFixed(4)}</td>`;
            tbody.appendChild(tr);
          });

          status.textContent = `Loaded ${journal.length} cycles. Last run: ${state.lastRunAt ?? 'never'}.`;
        } catch (err) {
          const notYet = /404/.test(String(err.message));
          status.className = notYet ? 'muted' : 'err';
          status.textContent = notYet
            ? 'Waiting for the first cycle — no state committed yet. The agent fills this once it ticks: enable the Actions heartbeat (repo secrets + seed the wallet), or run `npm run tick` locally and commit /state.'
            : `Could not load state (${err.message}).`;
        }
      })();
    </script>
  </body>
</html>
