name: automaton-heartbeat

# The heartbeat. One scheduled run = one cycle (one tick).
#
# NOTE: GitHub Actions cron is coarse and best-effort — it fires roughly every
# 5+ minutes at the finest, and scheduled runs are frequently DELAYED (sometimes
# by many minutes) or skipped under load. This is NOT a truly continuous loop.
# For a real heartbeat, run `npm run tick` on a timer on a VPS / Cloud Run /
# systemd timer instead (see the README).

on:
  schedule:
    # Every 15 minutes (subject to the coarseness/delay noted above).
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # allow manual ticks from the Actions tab

# Only one tick at a time; never overlap cycles.
concurrency:
  group: automaton-heartbeat
  cancel-in-progress: false

permissions:
  contents: write # to commit updated /state back to the repo

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run one cycle
        id: tick
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          AGENT_PUBKEY: ${{ secrets.AGENT_PUBKEY }}
          AGENT_KEYPAIR: ${{ secrets.AGENT_KEYPAIR }}
          MARKET_PUBKEY: ${{ secrets.MARKET_PUBKEY }}
          MARKET_KEYPAIR: ${{ secrets.MARKET_KEYPAIR }}
          COMPUTE_PROVIDER_PUBKEY: ${{ secrets.COMPUTE_PROVIDER_PUBKEY }}
          OPERATOR_PUBKEY: ${{ secrets.OPERATOR_PUBKEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # exit 1 means the agent died this cycle; we still want to persist state,
        # so don't fail the job on a death — capture the code and continue.
        continue-on-error: true
        run: |
          set +e
          npm run --silent tick
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit updated state
        run: |
          git config user.name "automaton-bot"
          git config user.email "automaton-bot@users.noreply.github.com"
          git add state/ SOUL.md || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "heartbeat: cycle state update"
            git push
          fi

      - name: Surface death
        if: steps.tick.outputs.exit_code == '1'
        run: |
          echo "::warning::The automaton died this cycle (balance <= dust). See state/obituaries."
