name: automaton-heartbeat

# The heartbeat — now BURST-based, to work around GitHub's flaky cron.
#
# GitHub Actions `schedule` is coarse and best-effort: runs are frequently
# delayed by many minutes or skipped entirely (we have seen multi-hour gaps).
# So instead of "one trigger = one cycle", ONE trigger starts a BURST: the job
# runs a cycle every BURST_INTERVAL_SECONDS (15 min) for up to BURST_CYCLES
# cycles (~2h), committing state after each. A single successful trigger then
# keeps cycles flowing for hours, even through a cron drought.
#
# The shared `concurrency` group means only one burst runs at a time across the
# heartbeat and the watchdog, and burst.sh's stale-guard makes any overlapping
# trigger a cheap no-op — so they never double-tick.
#
# For a perfectly regular cadence, run `npm run tick` on a timer on a VPS /
# Cloud Run / systemd timer instead (see the README).

on:
  schedule:
    # Every 15 minutes — the target cadence. Extra/late triggers are harmless:
    # they queue behind a running burst (concurrency) or no-op via the stale-guard.
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # allow manual bursts from the Actions tab

# One burst at a time across BOTH the heartbeat and the watchdog (shared group),
# so they never run cycles simultaneously.
concurrency:
  group: automaton-tick
  cancel-in-progress: false

permissions:
  contents: write # to commit updated /state back to the repo
  actions: write # to dispatch the Pages redeploy after each cycle

env:
  # Cadence + burst length (see .github/scripts/burst.sh for the semantics).
  BURST_CYCLES: '8' # ~2h of autonomous cycles per trigger
  BURST_INTERVAL_SECONDS: '900' # a cycle every 15 min
  STALE_SECONDS: '780' # skip if a cycle ran < 13 min ago (a burst is already active)

jobs:
  tick:
    runs-on: ubuntu-latest
    # A burst is up to ~2h of cycles; cap generously below the 6h job limit.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run a burst of cycles
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          AGENT_PUBKEY: ${{ secrets.AGENT_PUBKEY }}
          AGENT_KEYPAIR: ${{ secrets.AGENT_KEYPAIR }}
          MARKET_PUBKEY: ${{ secrets.MARKET_PUBKEY }}
          MARKET_KEYPAIR: ${{ secrets.MARKET_KEYPAIR }}
          COMPUTE_PROVIDER_PUBKEY: ${{ secrets.COMPUTE_PROVIDER_PUBKEY }}
          OPERATOR_PUBKEY: ${{ secrets.OPERATOR_PUBKEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Replication remains disabled until a child runtime exists.
          REPLICATION_ENABLED: 'false'
          PUMP_DEVNET_ENABLED: 'true'
          NFT_DEVNET_ENABLED: 'true'
          SPL_DEVNET_ENABLED: 'true'
          # Lets the burst dispatch the Pages redeploy after each cycle's push.
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/burst.sh
