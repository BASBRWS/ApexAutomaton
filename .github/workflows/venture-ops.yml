name: venture-ops

# The "Mark live" button, server-side. The dashboard is a static page and cannot
# write state, so its button opens a pre-filled GitHub issue titled
# "venture-live: <id>" with the public sales URL in the body. This workflow reacts:
# it flips that venture to LIVE in state/ventures.json (starting the kill-criteria
# clock), then the heartbeat loop begins monitoring the listing each cycle.
#
# Secretless: uses the built-in GITHUB_TOKEN only. It never touches real money —
# it just records that the human launched the venture.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write # commit the updated state/ventures.json
  issues: write # comment on and close the triggering issue

jobs:
  mark-live:
    # Only act on the button's issues, while still open.
    if: startsWith(github.event.issue.title, 'venture-live:') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Parse the venture id and live URL
        id: parse
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          # id: the token after "venture-live:" in the title (e.g. v0001).
          VID=$(printf '%s' "$TITLE" | sed -E 's/^venture-live:[[:space:]]*//' | grep -oE '^[A-Za-z0-9_-]+' || true)
          # url: the first http(s) link in the body, if the human pasted one.
          URL=$(printf '%s' "$BODY" | grep -oiE 'https?://[^[:space:]<>"]+' | head -n1 || true)
          echo "vid=$VID" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Parsed venture=$VID url=$URL"

      - name: Mark the venture live
        id: mark
        if: steps.parse.outputs.vid != ''
        run: |
          git config user.name "automaton-bot"
          git config user.email "automaton-bot@users.noreply.github.com"
          OUT=$(npx --yes tsx scripts/venture-mark-live.ts "${{ steps.parse.outputs.vid }}" "${{ steps.parse.outputs.url }}" 2>&1) || {
            echo "result=$OUT" >> "$GITHUB_OUTPUT"; echo "$OUT"; exit 1;
          }
          echo "result=$OUT" >> "$GITHUB_OUTPUT"
          echo "$OUT"
          git add state/ventures.json
          if git diff --cached --quiet; then
            echo "No change to commit (already live?)."
            exit 0
          fi
          git commit -m "venture ${{ steps.parse.outputs.vid }} marked live (via issue #${{ github.event.issue.number }})"
          for a in 1 2 3 4; do
            git pull --rebase --autostash origin main || true
            if git push origin HEAD:main; then break; fi
            echo "push retry $a"; sleep $((a*2))
          done

      - name: Comment and close the issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const vid = '${{ steps.parse.outputs.vid }}';
            const url = '${{ steps.parse.outputs.url }}';
            const result = `${{ steps.mark.outputs.result }}`;
            const ok = ${{ steps.mark.outcome == 'success' }};
            const body = ok
              ? `✅ Venture **${vid || '(unknown)'}** is now LIVE${url ? ` at ${url}` : ''}. The agent will monitor it each cycle (uptime + the kill-criteria clock). Report sales any time by editing \`revenueUsd\` in \`state/ventures.json\` (or just tell Claude) — real revenue folds into the combined scoreboard.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`
              : `⚠️ Could not mark a venture live from this issue. Make sure the title is \`venture-live: <id>\` (e.g. \`venture-live: v0001\`) and the body contains your public sales link. Details: ${result || '(none)'}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
            if (ok) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, state: 'closed',
              });
            }
