name: automaton-watchdog

# Redundancy for GitHub's flaky cron. Same burst logic as the heartbeat, on an
# OFFSET schedule — a second chance to START a burst if the heartbeat's trigger
# was skipped or delayed. It shares the heartbeat's concurrency lane, and
# burst.sh's stale-guard makes it a cheap no-op whenever a burst is already
# active, so the two never double-tick.

on:
  schedule:
    # Offset from the heartbeat's */15 (fires at :07, :22, :37, :52), so the two
    # schedules cover different moments and are less likely to both be skipped.
    - cron: '7-59/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: automaton-tick
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # to dispatch the Pages redeploy after each cycle

env:
  BURST_CYCLES: '8'
  BURST_INTERVAL_SECONDS: '900'
  STALE_SECONDS: '780'

jobs:
  tick-if-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run a burst of cycles (if none is active)
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          AGENT_PUBKEY: ${{ secrets.AGENT_PUBKEY }}
          AGENT_KEYPAIR: ${{ secrets.AGENT_KEYPAIR }}
          MARKET_PUBKEY: ${{ secrets.MARKET_PUBKEY }}
          MARKET_KEYPAIR: ${{ secrets.MARKET_KEYPAIR }}
          COMPUTE_PROVIDER_PUBKEY: ${{ secrets.COMPUTE_PROVIDER_PUBKEY }}
          OPERATOR_PUBKEY: ${{ secrets.OPERATOR_PUBKEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPLICATION_ENABLED: 'false'
          PUMP_DEVNET_ENABLED: 'true'
          NFT_DEVNET_ENABLED: 'true'
          SPL_DEVNET_ENABLED: 'true'
          # Lets the burst dispatch the Pages redeploy after each cycle's push.
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/burst.sh
