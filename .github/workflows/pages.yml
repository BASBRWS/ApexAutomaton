name: deploy-dashboard

# Publishes the dashboard (and, by the owner's choice, the setup wizard) to
# GitHub Pages — a VPS-free way to watch the agent. It serves the dashboard, the
# committed /state, and the setup wizard. Child secrets are never committed, so
# they never reach Pages. The setup wizard makes NO network calls, so anything
# typed into it stays in the visitor's browser — but it is marked noindex.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# (Pages on a private repo requires a paid GitHub plan; a public repo is free.)
#
# Redeploys on: a push to main that touches the dashboard/state/setup, AND after
# every heartbeat/watchdog run (their own state push does NOT trigger workflows
# because it uses GITHUB_TOKEN, so we react to those workflows completing).

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'setup/**'
      - 'state/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ["automaton-heartbeat", "automaton-watchdog"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Always publish the latest main: on workflow_run the default checkout is
      # the triggering run's starting SHA (before it committed state), so pin main.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble the site (dashboard + state + setup wizard)
        run: |
          mkdir -p _site/dashboard _site/state _site/setup
          cp dashboard/index.html _site/dashboard/index.html
          cp setup/index.html _site/setup/index.html
          # Copy committed state (may be just a README before the first tick).
          cp -r state/. _site/state/ 2>/dev/null || true
          # Child secrets are gitignored and never committed, but be defensive.
          rm -rf _site/state/children
          # Root redirect to the dashboard.
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./dashboard/">
          <title>Apex Automaton</title>
          <a href="./dashboard/">Go to the dashboard</a>
          HTML
          # Discourage indexing of the state snapshot and the setup wizard.
          printf 'User-agent: *\nDisallow: /state/\nDisallow: /setup/\n' > _site/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
